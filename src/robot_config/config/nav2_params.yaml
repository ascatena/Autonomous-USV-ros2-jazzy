amcl:
  ros__parameters:
    enabled: false # No usamos AMCL (usas robot_localization)

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered #Tópico donde publica el EKF global
    bt_loop_duration: 10
    default_server_timeout: 20
    # IMPORTANTE: Aquí referenciamos el XML que haremos en el siguiente paso
    default_nav_to_pose_bt_xml: "{path_to_pkg}/config/usv_nav.xml"
    default_nav_through_poses_bt_xml: "{path_to_pkg}/config/usv_nav.xml" 

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0 # Hz 
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # --- CONFIGURACIÓN DEL CHECKER ---
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 4.0 # 4 metro de tolerancia (GPS tiene error)
      yaw_goal_tolerance: 0.5 # Radianes

    # --- CONFIGURACIÓN DE PURE PURSUIT (TU MOTOR) ---
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.0 # m/s 
      lookahead_dist: 1.5 # Mira 1.5m adelante. Aumentar si el barco oscila.
      min_lookahead_dist: 0.5
      max_lookahead_dist: 2.5
      lookahead_time: 1.5
      rotate_to_heading_min_angle: 0.785
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      use_approach_linear_velocity_scaling: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: false # Falso para barcos (evita giros sobre el eje)
      allow_reversing: false # Falso porque no puede retroceder

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 1.0 #se disminuyo de 5 a 1
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 40 # 10x10 metros alrededor del barco
      height: 40
      resolution: 0.5
      # No hay ObstacleLayer, solo Inflation para seguridad interna
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0 #se bajo de 5 a 1
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 0.35 
      resolution: 0.5
      track_unknown_space: true
      # Rolling Window TRUE para simular mapa infinito centrado en el robot
      rolling_window: true
      width: 100 
      height: 100
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 0.2
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner" # NavFn en mapa vacío = Linea Recta
      tolerance: 4.0     #Se aumento la tolerancia al punto
      use_astar: false
      allow_unknown: true # IMPORTANTE: Permite planificar sobre lo desconocido (mar abierto)
